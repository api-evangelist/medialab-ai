    process:
    - The endpoint documentation will be marked as deprecated and a migration plan will be added.
    - >-
      The endpoint will have a Sunset header added to indicate the last date the
      endpoint should be relied upon.
    - An email will be sent to active third party developers notifying of the deprecation.
    - An entry to the API changelog table will be added.
    - >-
      When the Sunset date has passed a follow-up email will be sent to active third
      party developers notifying of the deprecation.
