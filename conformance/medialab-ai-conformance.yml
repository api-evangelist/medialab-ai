note: >-
  Cross-cutting standards conformance derived from each brand's published API
  documentation and from the artifacts already in this repo. MediaLab.AI publishes no
  trust centre and no certification claims (SOC 2, ISO 27001, PCI DSS, HIPAA,
  FedRAMP) at medialab.la, genius.com or imgur.com, so no Compliance pointer is
  emitted in apis.yml.
standards:
- id: oauth2
  conforms: true
  evidence: >-
    Both APIs require OAuth 2.0. Genius documents authorization-code and implicit
    flows at api.genius.com/oauth/authorize and /oauth/token; Imgur documents the
    implicit flow plus refresh_token grant at api.imgur.com/oauth2/authorize and
    /oauth2/token.
  applies_to:
  - Genius API
  - Imgur API
- id: oauth2-authorization-code
  conforms: true
  evidence: Genius documents response_type=code exchanged for a token at /oauth/token.
  applies_to:
  - Genius API
- id: oauth2-implicit
  conforms: true
  caveat: >-
    Imgur documents token (implicit) as the ONLY supported response_type and has
    deprecated code and pin - the implicit flow is discouraged by OAuth 2.0 Security
    Best Current Practice (RFC 9700). Genius supports it but warns against it.
  evidence: https://apidocs.imgur.com/#the-response_type-parameter
  applies_to:
  - Imgur API
  - Genius API
- id: oauth2-scopes
  conforms: partial
  evidence: >-
    Genius publishes four scopes (me, create_annotation, manage_annotation, vote).
    Imgur's authorization request accepts no scope parameter at all.
  applies_to:
  - Genius API
- id: rfc8414-oauth-authorization-server-metadata
