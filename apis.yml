apis:
- name: Genius API
  description: 'The Genius API exposes the music knowledge community behind genius.com:
    annotations (crowd-sourced explanations attached to a fragment of a document),
    referents (the fragments annotations attach to), songs, artists, web pages and
    search. All requests are authenticated with OAuth 2.0 - read-only endpoints can
    use a client access token, while annotation creation, management and voting require
    user-authorized scopes. Responses are JSON wrapped in a meta/response envelope.
    Commercial use requires a license from Genius.'
  humanURL: https://docs.genius.com/
