- name: Imgur API
  description: 'The Imgur API (version 3) exposes the Imgur image-sharing and community
    platform over a RESTful HTTPS interface: image upload and retrieval, albums, the
    public gallery and its tags, comments, and account resources including favorites,
    submissions, settings and blocks. Authentication is OAuth 2.0 - anonymous and
    public read-only calls use a Client-ID authorization header, while account-scoped
    calls use a bearer access token. Responses are wrapped in a data/status/success
    envelope and are available as JSON, JSONP or XML. Commercial use is routed through
    RapidAPI.'
