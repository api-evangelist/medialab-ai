aid: medialab-ai
name: MediaLab.AI
description: 'MediaLab.AI Inc. is a Santa Monica, California holding company for consumer
  internet brands. Rather than building products from scratch, MediaLab acquires and
  operates established community and media properties, and monetizes them through
  advertising across an owned-and-operated portfolio that reaches roughly one in three
  US internet users each month. The portfolio includes Genius (music knowledge, lyrics
  and annotations), Imgur (image sharing and community), Kik (messaging), WorldStarHipHop
  (hip hop media), Whisper (anonymous sharing), Amino (interest communities) and DatPiff
  (mixtapes). MediaLab also operates Assembly Exchange, its owned-and-operated programmatic
  ad exchange. The company itself publishes no corporate developer portal; its public
  API surface is carried by two portfolio brands - the Genius API (docs.genius.com,
  OAuth 2.0, annotations/songs/artists/search) and the Imgur API v3 (apidocs.imgur.com,
  OAuth 2.0, images/albums/galleries/comments/accounts), the latter documented as a
  public Postman collection.'
