note: >-
  Entity graph derived from the resource sections of each brand's published API
  reference and from the path/identifier variables in Imgur's public Postman
  collection. Neither brand publishes an OpenAPI definition, so relationships are
  derived from documented resource descriptions and identifier reference fields
  rather than from schema $ref links. Field-level schemas are not published by either
  brand and are NOT reconstructed here.
graphs:
- api: Genius API
  entities:
  - name: annotation
    identifier: id
    description: >-
      A piece of content about a part of a document. Annotation data returned from the
      API includes both the substance of the annotation and the information needed to
      display it in its original context.
    operations:
    - GET /annotations/:id
    - POST /annotations
    - PUT /annotations/:id
    - DELETE /annotations/:id
    - PUT /annotations/:id/upvote
    - PUT /annotations/:id/downvote
    - PUT /annotations/:id/unvote
  - name: referent
    identifier: id
    description: >-
      The section of a piece of content to which annotations are attached. Each
      referent is associated with a web page or a song and may have one or more
      annotations.
    operations:
    - GET /referents
  - name: song
    identifier: id
    description: >-
      A document hosted on Genius, usually music lyrics. Song data includes details
      about the document and information about all referents attached to it.
    operations:
    - GET /songs/:id
  - name: artist
    identifier: id
    description: >-
      How Genius represents the creator of one or more songs - usually a musician or
      group of musicians.
    operations:
    - GET /artists/:id
    - GET /artists/:id/songs
  - name: web_page
    identifier: id
    description: >-
      A single, publicly accessible page to which annotations may be attached. Web
      pages map 1-to-1 with unique, canonical URLs. Data is only available for pages
      that already have at least one annotation.
    lookup_keys:
    - raw_annotatable_url
    - canonical_url
    - og_url
    operations:
    - GET /web_pages/lookup
  - name: account
    identifier: id
    description: General contact information and Genius-specific details about a user.
    operations:
    - GET /account
  relationships:
  - from: annotation
    to: referent
    kind: belongs_to
    via: referent
    evidence: >-
      "When a new annotation is created either a referent is created with it or that
      annotation is attached to an existing referent."
  - from: referent
    to: annotation
    kind: has_many
    evidence: '"may have one or more annotations"'
  - from: referent
    to: song
    kind: belongs_to
    via: song_id
    evidence: GET /referents accepts song_id
  - from: referent
    to: web_page
    kind: belongs_to
    via: web_page_id
    evidence: GET /referents accepts web_page_id
    note: You may pass only one of song_id and web_page_id, not both.
  - from: referent
    to: account
    kind: belongs_to
