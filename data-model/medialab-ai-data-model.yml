identifier_conventions:
- api: Imgur API
  note: >-
    Imgur uses opaque alphanumeric hashes rather than prefixed IDs. Anonymous
    resources carry a second identifier - deleteHash / albumDeleteHash - which is the
    only credential that can mutate or delete a resource not tied to an account.
- api: Genius API
  note: Genius uses plain integer IDs on every resource.
